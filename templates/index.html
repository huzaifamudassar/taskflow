<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow - DevOps Mid Lab</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f9; margin:0; }
    .box { max-width:600px; margin:40px auto; background:#fff; padding:24px;
           border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
    h1 { color:#2c3e50; }
    .server { font-size:13px; color:#888; margin-bottom:16px; }
    input[type=text] { width:70%; padding:8px; }
    button { padding:8px 14px; background:#2980b9; color:#fff; border:0; border-radius:4px; cursor:pointer; }
    li { padding:8px 0; border-bottom:1px solid #eee; list-style:none; }
    .done { text-decoration:line-through; color:#999; }
    a { margin-left:10px; font-size:13px; }
  </style>
</head>
<body>
<div class="box">
  <h1 id="app-title">TaskFlow</h1>
  <div class="server" id="server-name">Served by container: {{ host }}</div>

  <form action="/add" method="post">
    <input type="text" id="task-input" name="title" placeholder="Enter a new task" required>
    <button type="submit" id="add-btn">Add Task</button>
  </form>

  <ul id="task-list">
    {% for t in tasks %}
    <li class="{{ 'done' if t[2] else '' }}">
      {{ t[1] }}
      <a href="/toggle/{{ t[0] }}">toggle</a>
      <a href="/delete/{{ t[0] }}">delete</a>
    </li>
    {% endfor %}
  </ul>
</div>
</body>
</html>
